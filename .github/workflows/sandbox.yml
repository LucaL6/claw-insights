name: Sandbox Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build release
        run: bash scripts/build-release.sh 0.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: release-tgz
          path: dist/claw-insights-*.tgz

  sandbox-mock:
    name: Sandbox (Mock) — ${{ matrix.os }}
    needs: build-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release-tgz
          path: dist/

      - name: Install from tarball
        run: npm install -g dist/claw-insights-*.tgz

      - name: Run sandbox E2E (healthy)
        run: |
          chmod +x sandbox/mock-openclaw/bin/openclaw
          MOCK_SCENARIO=healthy bash sandbox/sandbox-verify.sh \
            --cli-path sandbox/mock-openclaw/bin/openclaw \
            --port 4111

      - name: Run sandbox E2E (offline)
        run: |
          MOCK_SCENARIO=offline bash sandbox/sandbox-verify.sh \
            --cli-path sandbox/mock-openclaw/bin/openclaw \
            --port 4112

      - name: Run sandbox E2E (no-sessions)
        run: |
          MOCK_SCENARIO=no-sessions bash sandbox/sandbox-verify.sh \
            --cli-path sandbox/mock-openclaw/bin/openclaw \
            --port 4113

  sandbox-real:
    name: Sandbox (Real OpenClaw) — ${{ matrix.os }}
    needs: build-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release-tgz
          path: dist/

      - name: Install OpenClaw
        env:
          # Pinned SHA-256 of the installer script.
          # To update: run `curl -fsSL https://openclaw.ai/install.sh | shasum -a 256`
          # and replace the hash below. Last verified: 2026-02-22.
          INSTALLER_SHA256: 'ee3324933f42fb018f46e7e7b5e9ce5bab1c86d8465ace57082eeb99bd2dc90e'
        run: |
          # Download installer
          curl -fsSL https://openclaw.ai/install.sh -o /tmp/openclaw-install.sh

          # Verify it's a shell script (not HTML error page or malicious redirect)
          FIRST_LINE=$(head -1 /tmp/openclaw-install.sh)
          if ! echo "$FIRST_LINE" | grep -qE '^#!.*/(ba)?sh'; then
            echo "❌ Downloaded file is not a shell script: $FIRST_LINE"
            exit 1
          fi

          # Verify SHA-256 against pinned hash
          if command -v sha256sum &>/dev/null; then
            ACTUAL_HASH=$(sha256sum /tmp/openclaw-install.sh | awk '{print $1}')
          else
            ACTUAL_HASH=$(shasum -a 256 /tmp/openclaw-install.sh | awk '{print $1}')
          fi

          echo "Expected: $INSTALLER_SHA256"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$INSTALLER_SHA256" ]; then
            echo ""
            echo "⚠️  Installer hash mismatch — the upstream script has changed."
            echo "   This is expected after OpenClaw releases. To update:"
            echo "   1. Review the new script: curl -fsSL https://openclaw.ai/install.sh | less"
            echo "   2. Update INSTALLER_SHA256 in .github/workflows/sandbox.yml"
            echo ""
            echo "   Failing this step to prevent running unverified code."
            exit 1
          fi

          echo "✅ Hash verified"
          bash /tmp/openclaw-install.sh

      - name: Start OpenClaw gateway
        run: |
          openclaw gateway start
          sleep 5
          openclaw gateway status
        timeout-minutes: 2

      - name: Install claw-insights
        run: npm install -g dist/claw-insights-*.tgz

      - name: Run sandbox verify (real CLI)
        run: |
          CLI_PATH=$(which openclaw)
          bash sandbox/sandbox-verify.sh --cli-path "$CLI_PATH"
        timeout-minutes: 3
        continue-on-error: true
