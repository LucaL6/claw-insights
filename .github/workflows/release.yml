name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on origin/main." >&2
            echo "Merge to main first, then retag from main and rerun release." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 'Security gate (prod deps: high+critical)'
        run: npm audit --audit-level=high --omit=dev

      - name: Generate types
        run: npm run codegen

      - name: Unit Tests (server)
        run: npm run -w @claw-insights/server test

      - name: Unit Tests (web)
        run: npm run -w @claw-insights/web test

      - name: Verify CLI runtime policy parity
        run: node scripts/check-cli-runtime-policy-parity.mjs

      - name: Build release
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Verify release tarball contents
        run: node scripts/check-release-tarball-assets.mjs ./dist/claw-insights-*.tgz

      - name: Install from tarball (Node 22)
        run: npm install -g ./dist/claw-insights-*.tgz

      - name: Smoke test installed CLI startup (Node 22)
        run: bash scripts/ci/smoke-release-install.sh 41141

      - name: Verify CLI version (Node 22)
        run: |
          ACTUAL_RAW="$(claw-insights --version | head -n 1 | awk '{print $NF}')"
          ACTUAL="${ACTUAL_RAW#v}"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Version mismatch: expected ${EXPECTED}, got ${ACTUAL_RAW}" >&2
            exit 1
          fi

      - name: Smoke test installed CLI snapshot subcommand (Node 22)
        run: bash scripts/ci/smoke-release-snapshot.sh 41151

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install from tarball (Node 23)
        run: npm install -g ./dist/claw-insights-*.tgz

      - name: Smoke test installed CLI startup (Node 23)
        run: bash scripts/ci/smoke-release-install.sh 41143

      - name: Verify CLI version (Node 23)
        run: |
          ACTUAL_RAW="$(claw-insights --version | head -n 1 | awk '{print $NF}')"
          ACTUAL="${ACTUAL_RAW#v}"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Version mismatch: expected ${EXPECTED}, got ${ACTUAL_RAW}" >&2
            exit 1
          fi

      - name: Smoke test installed CLI snapshot subcommand (Node 23)
        run: bash scripts/ci/smoke-release-snapshot.sh 41153

      - name: Upload tgz artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-insights-${{ github.ref_name }}
          path: dist/claw-insights-*.tgz
          retention-days: 90

  publish-github:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claw-insights-${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: claw-insights-*.tgz
          generate_release_notes: true

  publish-npm:
    name: npm Publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claw-insights-${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NPM_TAG="latest"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="rc"
          fi
          echo "Publishing claw-insights@$VERSION to dist-tag '$NPM_TAG'"
          npm publish claw-insights-*.tgz --access public --provenance --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
