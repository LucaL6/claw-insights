name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate types
        run: npm run codegen

      - name: Unit Tests (server)
        run: npm run -w @claw-insights/server test

      - name: Unit Tests (web)
        run: npm run -w @claw-insights/web test

      - name: Build release
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Upload tgz artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-insights-${{ github.ref_name }}
          path: dist/claw-insights-*.tgz
          retention-days: 90

  publish-github:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claw-insights-${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: claw-insights-*.tgz
          generate_release_notes: true

  publish-npm:
    name: npm Publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claw-insights-${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish claw-insights-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
