name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint (server)
        run: npm run -w @claw-insights/server lint

      - name: Legacy context gate (incremental)
        run: npm run -w @claw-insights/server lint:legacy-gate

      - name: ESLint (web)
        run: npm run -w @claw-insights/web lint

      - name: Type Check (server)
        run: npm run -w @claw-insights/server typecheck

      - name: actionlint
        uses: raven-actions/actionlint@v2

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

  test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Unit Tests with Coverage (server)
        run: npm run -w @claw-insights/server test -- --coverage

      - name: Unit Tests with Coverage (web)
        run: npm run -w @claw-insights/web test -- --coverage

      - name: Generate coverage summary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          {
            echo "## 📊 Coverage Summary"
            echo ""
            echo "### Server"
            echo '```'
            node -e "
              const data = JSON.parse(require('fs').readFileSync('packages/server/coverage/coverage-summary.json','utf8'));
              const t = data.total;
              console.log('Lines:      ' + t.lines.pct + '%');
              console.log('Branches:   ' + t.branches.pct + '%');
              console.log('Functions:  ' + t.functions.pct + '%');
              console.log('Statements: ' + t.statements.pct + '%');
            "
            echo '```'
            echo ""
            echo "### Web"
            echo '```'
            node -e "
              const data = JSON.parse(require('fs').readFileSync('packages/web/coverage/coverage-summary.json','utf8'));
              const t = data.total;
              console.log('Lines:      ' + t.lines.pct + '%');
              console.log('Branches:   ' + t.branches.pct + '%');
              console.log('Functions:  ' + t.functions.pct + '%');
              console.log('Statements: ' + t.statements.pct + '%');
            "
            echo '```'
          } > coverage-summary.md

      - name: Coverage PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-summary.md

  integration:
    name: Integration Tests (Server)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Make mock CLI executable
        run: chmod +x sandbox/mock-openclaw/bin/openclaw

      - name: Run integration tests (GraphQL resolvers)
        env:
          RUN_INTEGRATION: '1'
          MOCK_SCENARIO: healthy
          CLAW_INSIGHTS_CLI: ${{ github.workspace }}/sandbox/mock-openclaw/bin/openclaw
          CLAW_INSIGHTS_SESSIONS_PATH: ${{ github.workspace }}/sandbox/fixtures/sessions.json
          CLAW_INSIGHTS_SERVER_PORT: '4000'
        run: npm run -w @claw-insights/server test -- src/__tests__/resolvers.test.ts

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Run E2E
        run: npm run -w @claw-insights/web test:e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web/test-results/
            packages/web/playwright-report/
          retention-days: 7

  build-release:
    name: Build Release Package
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build release
        run: bash scripts/build-release.sh 0.0.0-ci

      - name: Install from tarball
        run: npm install -g ./dist/claw-insights-*.tgz

      - name: Verify CLI
        run: claw-insights --version
