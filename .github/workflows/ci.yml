name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Unit Tests (server)
        run: npm run -w @claw-insights/server test

      - name: Unit Tests (web)
        run: npm run -w @claw-insights/web test

  integration:
    name: Integration Tests (Server)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Make mock CLI executable
        run: chmod +x sandbox/mock-openclaw/bin/openclaw

      - name: Run integration tests (GraphQL resolvers)
        env:
          RUN_INTEGRATION: '1'
          MOCK_SCENARIO: healthy
          CLAW_INSIGHTS_CLI: ${{ github.workspace }}/sandbox/mock-openclaw/bin/openclaw
          CLAW_INSIGHTS_SESSIONS_PATH: ${{ github.workspace }}/sandbox/fixtures/sessions.json
          CLAW_INSIGHTS_SERVER_PORT: '4000'
        run: npm run -w @claw-insights/server test -- src/__tests__/resolvers.test.ts

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run -w @claw-insights/web test:e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web/test-results/
            packages/web/playwright-report/
          retention-days: 7
