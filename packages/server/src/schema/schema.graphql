# ═══════════════════════════════════════════════════
# Claw Insights — GraphQL Schema
# ═══════════════════════════════════════════════════

# ── Enums ──

enum SessionStatus {
  ACTIVE
  IDLE
  DONE
  FAILED
}

enum LogLevel {
  DEBUG
  INFO
  WARN
  ERROR
}

enum ChannelProvider {
  telegram
  slack
  discord
  webchat
  signal
  whatsapp
}

# ── Gateway ──

"""Gateway process status"""
type GatewayStatus {
  running: Boolean!
  pid: Int
  version: String!
  appVersion: String!
  updateAvailable: String
  uptime: String!
  startedAt: String
  connectLatencyMs: Int
  latestVersion: String
  securityCritical: Int!
  securityWarn: Int!
}

"""Usage cost summary from gateway"""
type UsageCost {
  totalCost: Float!
  totalTokensM: Float!
  todayCost: Float!
  todayTokensM: Float!
  fetchedAt: String!
}

"""System resource usage"""
type SystemResources {
  cpu: Float!
  memoryMB: Int!
  diskMB: Int!
  sampledAt: String!
}

"""Channel connectivity"""
type Channel {
  provider: ChannelProvider!
  name: String!
  connected: Boolean!
  latencyMs: Int
}

# ── Sessions ──

type Session {
  key: String!
  displayName: String!
  kind: String!
  model: String!
  channel: String
  totalTokens: Int!
  contextTokens: Int!
  usagePercent: Float!
  status: SessionStatus!
  updatedAt: Float!
  turnCount: Int!
  subAgents: [Session!]!
}

input SessionFilter {
  activeOnly: Boolean
  grouped: Boolean
  sortBy: SessionSortBy
}

enum SessionSortBy {
  UPDATED_AT
  TOKENS_DESC
  NAME
}

# ── Logs ──

type LogEntry {
  time: String!
  level: LogLevel!
  module: String!
  message: String!
}

type LogBatch {
  entries: [LogEntry!]!
  counts: LogCounts!
}

type LogCounts {
  debug: Int!
  info: Int!
  warn: Int!
  error: Int!
}

input LogFilter {
  level: LogLevel
  module: String
}

# ── Metrics ──

enum MetricsRange {
  THIRTY_MIN
  ONE_HOUR
  SIX_HOUR
  TWELVE_HOUR
  TWENTY_FOUR_HOUR
}

type ModelTokens {
  model: String!
  tokensK: Float!
}

type MetricsBucket {
  bucket: Int!
  label: String!
  epochStart: Int!
  sessions: Int!
  tokensK: Float!
  tokensByModel: [ModelTokens!]!
  apiCalls: Int!
  toolCalls: Int!
  errors: Int!
  warnings: Int!
  turns: Int!
  userTurns: Int!
  assistantTurns: Int!
  gatewayUp: Boolean!
  restartEvent: Boolean!
}

type MetricsSummary {
  date: String!
  range: MetricsRange!
  bucketMinutes: Int!
  timezone: String!
  buckets: [MetricsBucket!]!
  totalTokensK: Float!
  rangeTokensK: Float!
  totalErrors: Int!
  totalWarnings: Int!
  uptimePercent: Float!
  totalTurns: Int!
  warnings: [String!]!
}

# ── Cron ──

type CronJob {
  id: String!
  name: String
  enabled: Boolean!
  schedule: String!
  lastRunAt: String
  lastRunSuccess: Boolean
  nextRunAt: String
}

# ── Events ──

type EventEntry {
  timestamp: String!
  type: String!
  module: String!
  message: String!
}

type EventCounts {
  error: Int!
  warning: Int!
  restart: Int!
}

type EventsResult {
  events: [EventEntry!]!
  total: Int!
  counts: EventCounts!
}

type EventDensityBucket {
  hour: Int!
  count: Int!
  hasError: Boolean!
  hasWarning: Boolean!
  hasRestart: Boolean!
  errorCount: Int!
  warningCount: Int!
  restartCount: Int!
  epochStart: Int!
}
# ── Transcript ──

type TranscriptMessage {
  """ISO timestamp"""
  timestamp: String!
  """user | assistant | tool"""
  role: String!
  """Message text content (truncated if over limit)"""
  content: String!
  """Content was truncated from original"""
  contentTruncated: Boolean!
  """Assistant message model id"""
  model: String
  """Token usage breakdown (assistant only)"""
  usage: TranscriptTokenUsage
  """Tool name, e.g. Read, exec, Edit (tool only)"""
  toolName: String
}

type TranscriptTokenUsage {
  input: Int!
  output: Int!
  cacheRead: Int!
  cacheWrite: Int!
}

type PageInfo {
  startCursor: String
  endCursor: String
  hasPreviousPage: Boolean!
  hasNextPage: Boolean!
}

type SessionTranscript {
  """Session key"""
  sessionKey: String!
  """Session display name"""
  displayName: String!
  """Model at session start"""
  model: String!
  """Channel provider"""
  channel: String
  """Session kind: direct / group / cron"""
  kind: String!
  """Thinking level at session start"""
  thinkingLevel: String
  """Session start ISO timestamp"""
  startedAt: String!
  """File size in bytes"""
  fileSize: Int!
  """Total tokens consumed (input + output + cache read)"""
  totalTokens: Int!
  """Input tokens of the last assistant message (approx context window usage)"""
  contextTokens: Int!
  """Session duration in milliseconds"""
  durationMs: Int!
  """Whether this is a sub-agent session"""
  isSubAgent: Boolean!
  """Parent session display name (sub-agent only)"""
  parentDisplayName: String
  """First user message content (sub-agent spawn prompt)"""
  spawnPrompt: String
  """Structured messages"""
  messages: [TranscriptMessage!]!
  """Total message count in transcript file"""
  totalMessages: Int!
  pageInfo: PageInfo!
}

# ── Root Types ──

type Query {
  gateway: GatewayStatus!
  resources: SystemResources!
  channels: [Channel!]!
  sessions(filter: SessionFilter): [Session!]!
  metrics(date: String, range: MetricsRange): MetricsSummary!
  cronJobs: [CronJob!]!
  usageCost: UsageCost!
  recentLogs(count: Int): [LogEntry!]!
  events(from: Int, to: Int, types: [String!], limit: Int): EventsResult!
  eventDensity: [EventDensityBucket!]!
  eventCounts(from: Int, to: Int): EventCounts!
  lifetimeStats: LifetimeStats!
  """Fetch session transcript. Returns null if session/file not found."""
  sessionTranscript(sessionKey: String!, limit: Int, before: String, after: String): SessionTranscript
}

"""Lightweight signal emitted when a data source updates"""
type DataChangeSignal {
  source: String!
  ts: String!
}

# ── Lifetime Stats ──

"""
Lifetime aggregate statistics from transcript history.
Token values are cumulative API consumption (not context window size).
Uses Float to avoid GraphQL Int32 overflow — values are integer counts.
"""
type LifetimeStats {
  """Whether the initial scan has completed. If false, numeric fields may be zero/partial."""
  isReady: Boolean!
  """ISO timestamp — min of device.json createdAtMs and earliest transcript timestamp"""
  createdAt: String!
  daysSinceCreation: Int!
  """Count of transcript .jsonl files currently on disk (reflects deletions)"""
  totalSessions: Int!
  totalInputTokens: Float!
  totalOutputTokens: Float!
  totalCacheReadTokens: Float!
  totalCacheWriteTokens: Float!
  """Sum of input + output + cacheRead + cacheWrite"""
  totalTokens: Float!
  totalUserMessages: Int!
  totalAssistantMessages: Int!
}

type Subscription {
  logs(filter: LogFilter): LogBatch!
  """Lightweight signal — client should refetch the relevant query"""
  dataChanged: DataChangeSignal!
}
